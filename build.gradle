plugins {
    id 'java'
}

group = 'com.marte'
version = '1.0-SNAPSHOT'

configurations {
    mockitoAgent{
        transitive = false;
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    compileOnly("org.projectlombok:lombok:1.18.46")
    annotationProcessor("org.projectlombok:lombok:1.18.46")

    implementation 'io.projectreactor:reactor-core:3.8.5'
    testImplementation('io.projectreactor:reactor-test:3.8.5')

    // Upgraded Mockito — must be recent enough to support -javaagent loading
    testImplementation 'org.mockito:mockito-junit-jupiter:5.14.2'
    mockitoAgent 'org.mockito:mockito-core:5.14.2'

    implementation 'org.fusesource.jansi:jansi:2.4.0'
    implementation 'org.apache.logging.log4j:log4j-api:3.0.0-alpha1'
    implementation 'org.apache.logging.log4j:log4j-core:3.0.0-alpha1'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:3.0.0-alpha1'
    //implementation 'org.apache.logging.log4j:log4j-to-slf4j:3.0.0-alpha1'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}"
}